name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build and verify PoE2 Build
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          unzip -q poe2-build-source.zip -d "$RUNNER_TEMP/poe2-build"
          node "$RUNNER_TEMP/poe2-build/scripts/build-web.mjs"
          node "$RUNNER_TEMP/poe2-build/scripts/check-wasm.mjs"
          mkdir -p dist/poe2-build
          cp -a "$RUNNER_TEMP/poe2-build/dist/." dist/poe2-build/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
